<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strava Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="main">
    <div class="header-top">
      <h1>Strava Dashboard</h1>

      <div class="header-actions">
        <!-- Dark/Light mode toggle -->
        <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode" onclick="toggleTheme()">🌙</button>

        <!-- Advanced Actions Menu -->
        <div class="advanced-actions-menu">
          <button class="menu-trigger" onclick="toggleAdvancedMenu()" title="Advanced Actions">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <circle cx="6" cy="12" r="2" fill="currentColor"/>
              <circle cx="12" cy="12" r="2" fill="currentColor"/>
              <circle cx="18" cy="12" r="2" fill="currentColor"/>
            </svg>
          </button>
          <div id="advanced-menu" class="dropdown-menu">
            <button class="dropdown-item" onclick="refreshData(); toggleAdvancedMenu()">
              <span class="icon">⟳</span>
              Refresh (only new activities)
            </button>
            <button class="dropdown-item" onclick="fullPull(); toggleAdvancedMenu()">
              <span class="icon">↻</span>
              Full Data Pull
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="status"></div>

    <div id="spinner" style="display:none;">
      <div class="spinner-circle"></div>
    </div>

    <!-- KPI Summary Bar -->
    <div id="kpi-bar" class="kpi-bar" style="display:none;"></div>

    <!-- Activity Counts -->
    <div id="activity-counts" class="card">
      <div class="accent-bar"></div>
      <div class="card-header">
        <div style="display:flex;align-items:center;gap:8px;">
          <svg class="icon-lg" viewBox="0 0 24 24">
            <path d="M4 6h16M4 12h16M4 18h16" stroke="var(--clr-accent)" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Activity Counts
        </div>
      </div>
      <div id="activity-counts-content"></div>
    </div>

    <!-- Annual Stats -->
    <div id="annual-card" class="card">
      <div class="accent-bar"></div>
      <div class="card-header">
        <div style="display:flex;align-items:center;gap:8px;">
          <svg class="icon-lg" viewBox="0 0 24 24">
            <path d="M4 18V6m6 12V10m6 8V4m6 14V8" stroke="var(--clr-accent)" stroke-width="2"/>
          </svg>
          Annual Stats
        </div>
      </div>

      <h3 style="font-size:14px;color:var(--clr-text-muted);font-weight:500;margin-bottom:8px;">Filter Activity Types</h3>
      <div id="activity-type-checkboxes"></div>

      <div id="annual-stats-table"></div>
    </div>

    <!-- Bike Comparison Section -->
    <div id="bike-comparison-section" class="card" style="display:none; margin-bottom:24px;">
      <div id="comparison-content"></div>
    </div>

    <!-- Bike cards -->
    <div id="bike-grid" class="card-grid"></div>

  </div>

  <script>
    /* ===== THEME ===== */
    (function() {
      const saved = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
    })();

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      document.getElementById('theme-toggle').textContent = next === 'dark' ? '☀️' : '🌙';
    }

    // Set correct icon on load
    window.addEventListener('DOMContentLoaded', function() {
      const theme = document.documentElement.getAttribute('data-theme') || 'light';
      document.getElementById('theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';
    });

    /* ===== ADVANCED MENU ===== */
    function toggleAdvancedMenu() {
      const menu = document.getElementById('advanced-menu');
      menu.classList.toggle('open');
    }

    document.addEventListener('click', function(event) {
      const menu = document.getElementById('advanced-menu');
      const trigger = document.querySelector('.menu-trigger');
      if (!menu.contains(event.target) && !trigger.contains(event.target)) {
        menu.classList.remove('open');
      }
    });
  </script>

  <script src="app.js"></script>
</body>
</html>
