<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Strava Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="main">
    <div class="header-top">
      <h1>Strava Dashboard</h1>
      <div class="utility-actions">
        <button id="theme-toggle" class="menu-trigger secondary-trigger" title="Toggle theme" onclick="toggleTheme()">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/>
          </svg>
        </button>

        <div class="advanced-actions-menu">
          <button id="advanced-menu-trigger" class="menu-trigger" onclick="toggleAdvancedMenu()" title="Advanced Actions">
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
              <circle cx="6" cy="12" r="2" fill="currentColor"/>
              <circle cx="12" cy="12" r="2" fill="currentColor"/>
              <circle cx="18" cy="12" r="2" fill="currentColor"/>
            </svg>
          </button>
          <div id="advanced-menu" class="dropdown-menu">
            <button class="dropdown-item" onclick="refreshData(); toggleAdvancedMenu()">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 12a8 8 0 1 1-2.34-5.66" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M20 4v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Refresh (only new activities)
            </button>
            <button class="dropdown-item" onclick="resumePull(); toggleAdvancedMenu()">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 7L4 12l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M20 6v6a6 6 0 0 1-6 6H4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              Resume Pull (fill gaps)
            </button>
            <button class="dropdown-item" onclick="fullPull(); toggleAdvancedMenu()">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 4v6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M20 20v-6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M20 10A8 8 0 0 0 6.34 4.34L4 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M4 14a8 8 0 0 0 13.66 5.66L20 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              Full Data Pull
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="status-bar">
      <div id="status"></div>
      <div id="last-sync"></div>
    </div>

    <div id="spinner">
      <div class="spinner-wheel"></div>
    </div>

    <div id="kpi-summary" class="kpi-grid"></div>

    <div id="activity-counts" class="card">
      <div class="accent-bar"></div>
      <div class="card-header">
        <svg class="icon-lg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Activity Counts
      </div>
      <div id="activity-counts-content"></div>
    </div>

    <div id="annual-card" class="card">
      <div class="accent-bar"></div>
      <div class="card-header">
        <svg class="icon-lg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 18V6m6 12V10m6 8V4m6 14V8" stroke="currentColor" stroke-width="2"/>
        </svg>
        Annual Stats
      </div>

      <div class="annual-controls">
        <div class="annual-controls-label">Filter activity types</div>
        <div id="activity-type-checkboxes" class="filter-chip-group"></div>
      </div>

      <div id="annual-stats-table"></div>
    </div>

    <div id="highlights-card" class="card">
      <div class="accent-bar"></div>
      <div class="card-header">
        <svg class="icon-lg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9L12 3z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/>
        </svg>
        Highlights
      </div>
      <div id="highlights-content"></div>
    </div>

    <div id="bike-comparison-section" class="card comparison-panel">
      <div id="comparison-content"></div>
    </div>

    <div class="card bike-controls-card">
      <div class="bike-controls">
        <input id="bike-search" type="text" placeholder="Search bikes..." oninput="updateBikeFilters()">
        <select id="bike-sort" onchange="updateBikeFilters()">
          <option value="distance-desc">Sort: Distance (high to low)</option>
          <option value="distance-asc">Sort: Distance (low to high)</option>
          <option value="rides-desc">Sort: Activities (high to low)</option>
          <option value="rides-asc">Sort: Activities (low to high)</option>
          <option value="name-asc">Sort: Name (A-Z)</option>
          <option value="name-desc">Sort: Name (Z-A)</option>
        </select>
      </div>
    </div>

    <div id="bike-grid" class="card-grid"></div>
  </div>

  <script>
    function toggleAdvancedMenu() {
      const menu = document.getElementById("advanced-menu");
      menu.classList.toggle("open");
    }

    document.addEventListener("click", function(event) {
      const menu = document.getElementById("advanced-menu");
      const trigger = document.getElementById("advanced-menu-trigger");
      if (menu && trigger && !menu.contains(event.target) && !trigger.contains(event.target)) {
        menu.classList.remove("open");
      }
    });
  </script>

  <script src="app.js"></script>
</body>
</html>
